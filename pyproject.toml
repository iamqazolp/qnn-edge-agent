[project]
name = "qnn-edge-agent"
version = "0.1.0"
description = "Activation-aware mixed-precision quantization and Snapdragon Hexagon NPU profiling for on-device function-calling SLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "transformers>=4.45",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "numpy",
    "scipy",
    "pyyaml",
    "python-dotenv",
    "matplotlib",
    "lm-format-enforcer>=0.10",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "qai-hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qnn_edge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pyflakes only: catches real bugs (undefined names, unused imports) without
# imposing style rules on research code.
select = ["F"]
